<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sri Lanka">
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
  <clipPath id="sriLankaLand">
    <path d="M351.3 85.0 C356.9 87.4 366.7 99.8 371.4 107.9 C376.2 116.0 372.1 124.2 379.8 133.4 C387.5 142.5 407.8 153.1 417.7 163.0 C427.5 172.9 432.8 182.1 438.7 192.7 C444.5 203.3 448.3 214.7 453.0 226.7 C457.6 238.7 461.4 252.8 466.4 264.8 C471.4 276.9 479.0 287.5 483.2 298.8 C487.4 310.1 492.7 320.7 491.6 332.7 C490.5 344.7 483.9 361.3 476.5 370.9 C469.1 380.5 457.6 385.4 447.1 390.4 C436.6 395.3 424.0 396.8 413.4 400.6 C402.9 404.4 392.4 410.9 384.0 413.3 C375.6 415.7 370.7 416.4 363.0 415.0 C355.3 413.6 344.4 411.5 337.8 404.8 C331.2 398.2 326.3 387.1 323.5 375.1 C320.7 363.1 322.7 345.4 321.0 332.7 C319.3 320.0 315.5 310.8 313.4 298.8 C311.3 286.8 308.1 272.6 308.4 260.6 C308.7 248.6 312.3 237.3 315.1 226.7 C317.9 216.1 326.0 206.9 325.2 197.0 C324.4 187.1 308.7 176.5 310.1 167.3 C311.5 158.1 330.8 151.0 333.6 141.8 C336.4 132.6 326.2 120.2 326.9 112.1 C327.6 104.1 333.7 98.0 337.8 93.5 C341.9 89.0 345.6 82.6 351.3 85.0 Z"/>
  </clipPath>
</defs>
<style>
  .pz { animation: pz 3.6s ease-in-out infinite; transform-origin: 321.8px 330.2px; }
  @keyframes pz { 0%,100% { opacity:.15; transform: scale(.72) } 50% { opacity:.85; transform: scale(1.12) } }
  .sp { animation: sp 48s linear infinite; transform-origin: 400.0px 250.0px; }
  @keyframes sp { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .pz, .sp { animation: none } }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<g class="sp">
  <circle cx="400.0" cy="250.0" r="196" fill="none" stroke="#0a1b3c" stroke-opacity="0.13"
          stroke-width="1.5" stroke-dasharray="2 18"/>
</g>
<circle cx="400.0" cy="250.0" r="160" fill="none" stroke="#0a1b3c" stroke-opacity="0.11" stroke-width="1.5"/>

<!-- The Sri Lankan flag, clipped to the country silhouette: the maroon lion
     panel with a simplified gold lion-and-sword emblem and bo-leaf corners,
     the saffron and green stripes at the hoist, all at the flag's real
     construction proportions. -->
<g clip-path="url(#sriLankaLand)">
  <rect x="308.38" y="84.48" width="183.37" height="331.24" fill="#8D153A"/>
  <rect x="308.38" y="84.48" width="22.0" height="331.24" fill="#00534E"/>
  <rect x="330.38" y="84.48" width="18.33" height="331.24" fill="#EA7125"/>

  <!-- bo leaves, one per corner of the lion panel -->
  <g fill="#FDB913">
    <path transform="translate(362,112) scale(0.9)" d="M0,-14 C6,-14 8,-4 0,4 C-8,-4 -6,-14 0,-14 Z"/>
    <path transform="translate(476,108) scale(0.9)" d="M0,-14 C6,-14 8,-4 0,4 C-8,-4 -6,-14 0,-14 Z"/>
    <path transform="translate(360,392) scale(0.9)" d="M0,-14 C6,-14 8,-4 0,4 C-8,-4 -6,-14 0,-14 Z"/>
    <path transform="translate(474,392) scale(0.9)" d="M0,-14 C6,-14 8,-4 0,4 C-8,-4 -6,-14 0,-14 Z"/>
  </g>

  <!-- lion passant holding a sword, simplified/geometric: a walking stance,
       tail arched up over the back, jagged mane, open mouth -->
  <g transform="translate(363.5,168) scale(1.15)" fill="#FDB913">
    <!-- tail: sweeps up from the rear and arches forward over the back -->
    <path d="M60,54 C80,45 88,20 76,-2 C70,-10 58,-14 48,-12 C56,-6 62,2 64,10 C68,22 64,40 55,48 Z"/>
    <circle cx="49" cy="-13" r="6"/>
    <!-- hind leg, trailing -->
    <path d="M54,106 L49,146 L60,146 L60,110 Z"/>
    <!-- hind leg, mid-stride -->
    <path d="M63,102 C68,106 70,111 70,117 L67,144 L78,144 L75,106 Z"/>
    <!-- front leg, planted -->
    <path d="M30,106 C26,107 24,111 24,117 L22,145 L33,145 L34,109 Z"/>
    <!-- body: elongated, walking posture -->
    <path d="M27,48 C21,66 22,88 28,106 C35,116 55,118 63,110 C70,94 68,66 58,48 C51,40 34,41 27,48 Z"/>
    <!-- neck: a generously overlapping wedge, reaching well into the head circle
         and well into the body, so there is no gap at any scale -->
    <path d="M17,30 L46,44 L37,60 L20,46 Z"/>
    <!-- sword arm, raised -->
    <path d="M29,48 C19,44 12,33 12,20 C12,16 17,14 21,16 C25,25 28,38 31,47 Z"/>
    <!-- mane: jagged tufts across the back/crown of the head only -->
    <path d="M10,20 C14,10 23,6 31,9 L37,16 L30,20 L38,26 L31,29 L37,36 L29,37 L33,44 L24,43 C16,42 10,35 8,27 Z"/>
    <!-- head, smooth face over the mane -->
    <circle cx="17" cy="30" r="12"/>
    <!-- ear -->
    <path d="M13,20 L17,10 L22,21 Z"/>
    <!-- snout -->
    <path d="M5,27 C-1,28 -5,30 -7,32 C-5,34 -1,36 5,35 Z"/>
    <!-- sword: raised well above the mane -->
    <rect x="8" y="-14" width="4" height="70"/>
    <rect x="1" y="55" width="18" height="4"/>
    <rect x="8" y="59" width="4" height="9"/>
    <circle cx="10" cy="71" r="4.5"/>
    <!-- eye -->
    <circle cx="11" cy="27" r="1.8" fill="#8D153A"/>
    <!-- open mouth -->
    <path d="M-5,31 C-1,34 3,35 7,34" fill="none" stroke="#8D153A" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</g>
<path d="M351.3 85.0 C356.9 87.4 366.7 99.8 371.4 107.9 C376.2 116.0 372.1 124.2 379.8 133.4 C387.5 142.5 407.8 153.1 417.7 163.0 C427.5 172.9 432.8 182.1 438.7 192.7 C444.5 203.3 448.3 214.7 453.0 226.7 C457.6 238.7 461.4 252.8 466.4 264.8 C471.4 276.9 479.0 287.5 483.2 298.8 C487.4 310.1 492.7 320.7 491.6 332.7 C490.5 344.7 483.9 361.3 476.5 370.9 C469.1 380.5 457.6 385.4 447.1 390.4 C436.6 395.3 424.0 396.8 413.4 400.6 C402.9 404.4 392.4 410.9 384.0 413.3 C375.6 415.7 370.7 416.4 363.0 415.0 C355.3 413.6 344.4 411.5 337.8 404.8 C331.2 398.2 326.3 387.1 323.5 375.1 C320.7 363.1 322.7 345.4 321.0 332.7 C319.3 320.0 315.5 310.8 313.4 298.8 C311.3 286.8 308.1 272.6 308.4 260.6 C308.7 248.6 312.3 237.3 315.1 226.7 C317.9 216.1 326.0 206.9 325.2 197.0 C324.4 187.1 308.7 176.5 310.1 167.3 C311.5 158.1 330.8 151.0 333.6 141.8 C336.4 132.6 326.2 120.2 326.9 112.1 C327.6 104.1 333.7 98.0 337.8 93.5 C341.9 89.0 345.6 82.6 351.3 85.0 Z"
      fill="none" stroke="#FDB913" stroke-width="5" stroke-linejoin="round"/>
<path d="M351.3 85.0 C356.9 87.4 366.7 99.8 371.4 107.9 C376.2 116.0 372.1 124.2 379.8 133.4 C387.5 142.5 407.8 153.1 417.7 163.0 C427.5 172.9 432.8 182.1 438.7 192.7 C444.5 203.3 448.3 214.7 453.0 226.7 C457.6 238.7 461.4 252.8 466.4 264.8 C471.4 276.9 479.0 287.5 483.2 298.8 C487.4 310.1 492.7 320.7 491.6 332.7 C490.5 344.7 483.9 361.3 476.5 370.9 C469.1 380.5 457.6 385.4 447.1 390.4 C436.6 395.3 424.0 396.8 413.4 400.6 C402.9 404.4 392.4 410.9 384.0 413.3 C375.6 415.7 370.7 416.4 363.0 415.0 C355.3 413.6 344.4 411.5 337.8 404.8 C331.2 398.2 326.3 387.1 323.5 375.1 C320.7 363.1 322.7 345.4 321.0 332.7 C319.3 320.0 315.5 310.8 313.4 298.8 C311.3 286.8 308.1 272.6 308.4 260.6 C308.7 248.6 312.3 237.3 315.1 226.7 C317.9 216.1 326.0 206.9 325.2 197.0 C324.4 187.1 308.7 176.5 310.1 167.3 C311.5 158.1 330.8 151.0 333.6 141.8 C336.4 132.6 326.2 120.2 326.9 112.1 C327.6 104.1 333.7 98.0 337.8 93.5 C341.9 89.0 345.6 82.6 351.3 85.0 Z"
      fill="none" stroke="#0a1b3c" stroke-width="1.5" stroke-linejoin="round"/>

<g class="pz"><circle cx="321.8" cy="330.2" r="26" fill="#2e7bff"/></g>
<circle cx="321.8" cy="330.2" r="17" fill="none" stroke="#46d3ff" stroke-width="1.6" stroke-opacity="0.8"/>
<circle cx="321.8" cy="330.2" r="7" fill="#2e7bff" stroke="#fff" stroke-width="2.5"/>
</svg>
