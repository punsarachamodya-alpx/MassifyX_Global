<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <!-- Fade the grid out toward the left so the hero copy stays clean; strongest on the right behind the figure. -->
    <linearGradient id="hgFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="78%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
    <mask id="hgMask"><rect width="1440" height="760" fill="url(#hgFade)"/></mask>
  </defs>

  <style>
    .ray  { animation: draw 9s ease-in-out infinite; }
    @keyframes draw { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    .trav { stroke-dasharray: 3 16; animation: trav 6s linear infinite; }
    @keyframes trav { to { stroke-dashoffset: -190; } }
    .spark { animation: spark 4.4s ease-in-out infinite; }
    @keyframes spark { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .ray,.trav,.spark { animation: none; } }
  </style>

  <!-- Vanishing point at ~ (1030, 320). Perspective rays fanning out to the frame. -->
  <g mask="url(#hgMask)">
    <g stroke="#002d5c" stroke-opacity="0.13" stroke-width="1" fill="none" class="ray">
      <path d="M1030 320 L1440 -40"/>
      <path d="M1030 320 L1440 130"/>
      <path d="M1030 320 L1440 320"/>
      <path d="M1030 320 L1440 520"/>
      <path d="M1030 320 L1440 800"/>
      <path d="M1030 320 L1030 800"/>
      <path d="M1030 320 L620 800"/>
      <path d="M1030 320 L300 760"/>
      <path d="M1030 320 L120 560"/>
      <path d="M1030 320 L120 320"/>
      <path d="M1030 320 L300 60"/>
      <path d="M1030 320 L720 -40"/>
    </g>

    <!-- Receding rounded squares toward the vanishing point -->
    <g fill="none" stroke="#002d5c" stroke-opacity="0.12" stroke-width="1">
      <rect x="470" y="20"  width="1120" height="600" rx="10"/>
      <rect x="640" y="110" width="820"  height="440" rx="8"/>
      <rect x="770" y="180" width="580"  height="300" rx="6"/>
      <rect x="875" y="240" width="340"  height="180" rx="5"/>
      <rect x="955" y="285" width="170"  height="90"  rx="4"/>
    </g>

    <!-- Travelling dashes flowing inward toward the vanishing point -->
    <g stroke="#1877F2" stroke-opacity="0.5" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path class="trav" d="M1440 130 L1030 320"/>
      <path class="trav" d="M1440 520 L1030 320"/>
      <path class="trav" d="M300 760 L1030 320"/>
      <path class="trav" d="M120 560 L1030 320"/>
      <path class="trav" d="M300 60 L1030 320"/>
    </g>

    <!-- Node sparks near the vanishing point -->
    <g fill="#1877F2">
      <circle class="spark" cx="1030" cy="320" r="4"/>
      <circle class="spark" cx="955" cy="285" r="2.5"/>
      <circle class="spark" cx="1125" cy="375" r="2.5"/>
      <circle class="spark" cx="875" cy="240" r="2"/>
      <circle class="spark" cx="1215" cy="420" r="2"/>
    </g>
  </g>
</svg>
