<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#1877F2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1877F2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#46b4ff" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="rgrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .flow  { stroke-dasharray: 6 12; animation: dash 5.5s linear infinite; }
    .flow2 { stroke-dasharray: 6 12; animation: dash 7.5s linear infinite; }
    .flow3 { stroke-dasharray: 6 12; animation: dash 6.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -216; } }
    .pulse { animation: pulse 4.2s ease-in-out infinite; transform-origin: 862px 250px; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .node  { animation: node 3.6s ease-in-out infinite; }
    @keyframes node { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow,.flow2,.flow3,.pulse,.node { animation: none; }
    }
  </style>

  <rect width="1600" height="420" fill="#001d3c"/>
  <rect width="1600" height="420" fill="url(#rgrid)"/>
  <ellipse cx="862" cy="250" rx="520" ry="300" fill="url(#hubGlow)"/>

  <!-- Faint base routes: the whole network, always visible -->
  <g stroke="#1877F2" stroke-opacity="0.22" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M862 250 C 640 180, 420 150, 150 120"/>
    <path d="M862 250 C 620 240, 400 250, 120 250"/>
    <path d="M862 250 C 640 300, 430 340, 170 360"/>
    <path d="M862 250 C 700 150, 560 90, 360 70"/>
    <path d="M862 250 C 1040 180, 1220 150, 1470 120"/>
    <path d="M862 250 C 1060 240, 1260 250, 1500 250"/>
    <path d="M862 250 C 1050 310, 1240 350, 1460 360"/>
    <path d="M862 250 C 1000 160, 1140 100, 1300 78"/>
  </g>

  <!-- Animated flowing routes on top: the live lanes -->
  <g fill="none" stroke="url(#route)" stroke-width="2.2" stroke-linecap="round">
    <path class="flow"  d="M862 250 C 640 180, 420 150, 150 120"/>
    <path class="flow2" d="M862 250 C 620 240, 400 250, 120 250"/>
    <path class="flow3" d="M862 250 C 640 300, 430 340, 170 360"/>
    <path class="flow2" d="M862 250 C 1040 180, 1220 150, 1470 120"/>
    <path class="flow"  d="M862 250 C 1060 240, 1260 250, 1500 250"/>
    <path class="flow3" d="M862 250 C 1050 310, 1240 350, 1460 360"/>
  </g>

  <!-- Destination nodes -->
  <g fill="#46b4ff">
    <circle class="node" cx="150" cy="120" r="4"/>
    <circle class="node" cx="120" cy="250" r="4"/>
    <circle class="node" cx="170" cy="360" r="4"/>
    <circle class="node" cx="360" cy="70"  r="3.5"/>
    <circle class="node" cx="1470" cy="120" r="4"/>
    <circle class="node" cx="1500" cy="250" r="4"/>
    <circle class="node" cx="1460" cy="360" r="4"/>
    <circle class="node" cx="1300" cy="78"  r="3.5"/>
  </g>

  <!-- The Sri Lanka control hub -->
  <g class="pulse">
    <circle cx="862" cy="250" r="46" fill="none" stroke="#1877F2" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="862" cy="250" r="66" fill="none" stroke="#1877F2" stroke-opacity="0.25" stroke-width="1"/>
  </g>
  <circle cx="862" cy="250" r="30" fill="#001d3c" stroke="#1877F2" stroke-width="2"/>
  <circle cx="862" cy="250" r="7" fill="#46b4ff"/>
</svg>
