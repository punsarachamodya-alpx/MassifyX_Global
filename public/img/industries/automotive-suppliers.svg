<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
  <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2e7bff"/><stop offset="100%" stop-color="#46d3ff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1b3c" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#16305c" stop-opacity="0.72"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .fl { animation: fl 7s linear infinite; }
  @keyframes fl { to { stroke-dashoffset: -180; } }
  .pz { animation: pz 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes pz { 0%,100% { opacity:.28 } 50% { opacity:.95 } }
  .dr { animation: dr 9s linear infinite; }
  @keyframes dr { to { transform: translateX(120px); } }
  .sp { animation: sp 16s linear infinite; transform-origin: 50% 50%; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fl, .pz, .dr, .sp { animation: none; }
  }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<g fill="none" stroke="#0a1b3c" stroke-opacity="0.32" stroke-width="2">
  <path d="M96 130 L300 250 L96 370"/>
  <path d="M216 130 L420 250 L216 370"/>
</g>
<g fill="none" stroke="url(#lane)" stroke-width="3.5" stroke-linecap="round">
  <path d="M336 130 L540 250 L336 370"/>
</g>
<g fill="#0a1b3c" opacity="0.82">
  <rect x="72" y="118" width="26" height="26" rx="2"/>
  <rect x="72" y="238" width="26" height="26" rx="2"/>
  <rect x="72" y="358" width="26" height="26" rx="2"/>
  <rect x="192" y="118" width="26" height="26" rx="2"/>
  <rect x="192" y="358" width="26" height="26" rx="2"/>
</g>
<g class="pz"><circle cx="540" cy="250" r="40" fill="none" stroke="#46d3ff" stroke-width="2"/></g>
<circle cx="540" cy="250" r="28" fill="#fff" stroke="#2e7bff" stroke-width="3"/>
<path d="M530 240 L550 260 M550 240 L530 260" stroke="#0a1b3c" stroke-width="3" stroke-linecap="round"/>
<g stroke="#2e7bff" stroke-width="2.5" fill="none" stroke-linecap="round">
  <path class="fl" stroke-dasharray="8 12" d="M582 250 H740"/>
</g>
<rect x="700" y="222" width="56" height="56" rx="3" fill="#0a1b3c"/>
</svg>
