<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
  <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2e7bff"/><stop offset="100%" stop-color="#46d3ff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1b3c" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#16305c" stop-opacity="0.72"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .fl { animation: fl 7s linear infinite; }
  @keyframes fl { to { stroke-dashoffset: -180; } }
  .pz { animation: pz 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes pz { 0%,100% { opacity:.28 } 50% { opacity:.95 } }
  .dr { animation: dr 9s linear infinite; }
  @keyframes dr { to { transform: translateX(120px); } }
  .sp { animation: sp 16s linear infinite; transform-origin: 50% 50%; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fl, .pz, .dr, .sp { animation: none; }
  }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<g class="sp" style="transform-origin:300px 250px">
  <circle cx="300" cy="250" r="132" fill="none" stroke="#0a1b3c" stroke-opacity="0.2"
          stroke-width="2" stroke-dasharray="4 14"/>
</g>
<circle cx="300" cy="250" r="104" fill="none" stroke="#0a1b3c" stroke-opacity="0.3" stroke-width="2"/>
<circle cx="300" cy="250" r="72" fill="#fff" stroke="#2e7bff" stroke-width="3"/>
<g class="pz"><circle cx="300" cy="250" r="46" fill="none" stroke="#46d3ff" stroke-width="2"/></g>
<path d="M300 216 v68 M266 250 h68" stroke="#0a1b3c" stroke-width="9" stroke-linecap="round"/>
<g fill="none" stroke="url(#lane)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M448 250 h44 l18 -46 l26 92 l20 -60 l16 30 h84"/>
</g>
<g fill="#0a1b3c" opacity="0.55">
  <rect x="448" y="322" width="188" height="7" rx="3"/>
  <rect x="448" y="344" width="132" height="7" rx="3"/>
  <rect x="448" y="366" width="160" height="7" rx="3"/>
</g>
</svg>
