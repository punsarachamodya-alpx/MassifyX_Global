<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
  <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2e7bff"/><stop offset="100%" stop-color="#46d3ff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1b3c" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#16305c" stop-opacity="0.72"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .fl { animation: fl 7s linear infinite; }
  @keyframes fl { to { stroke-dashoffset: -180; } }
  .pz { animation: pz 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes pz { 0%,100% { opacity:.28 } 50% { opacity:.95 } }
  .dr { animation: dr 9s linear infinite; }
  @keyframes dr { to { transform: translateX(120px); } }
  .sp { animation: sp 16s linear infinite; transform-origin: 50% 50%; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fl, .pz, .dr, .sp { animation: none; }
  }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<g fill="none" stroke="#0a1b3c" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round">
  <path d="M70 140 H190 V210 H300"/>
  <path d="M70 250 H150 V330 H286"/>
  <path d="M70 360 H240 V300 H300"/>
  <path d="M500 140 H620 V232 H730"/>
  <path d="M514 250 H730"/>
  <path d="M500 360 H640 V296 H730"/>
</g>
<g fill="none" stroke="url(#lane)" stroke-width="2.6" stroke-linecap="round">
  <path class="fl" stroke-dasharray="9 13" d="M70 195 H140 V420 H660 V195 H730"/>
</g>
<rect x="300" y="170" width="200" height="160" rx="4" fill="#0a1b3c" opacity="0.92"/>
<rect x="336" y="206" width="128" height="88" rx="2" fill="none" stroke="#46d3ff"
      stroke-width="2" stroke-opacity="0.55"/>
<g class="pz"><circle cx="400" cy="250" r="26" fill="none" stroke="#46d3ff" stroke-width="2"/></g>
<g fill="#0a1b3c" opacity="0.9">
  <rect x="316" y="150" width="12" height="20" rx="2"/><rect x="356" y="150" width="12" height="20" rx="2"/>
  <rect x="432" y="150" width="12" height="20" rx="2"/><rect x="472" y="150" width="12" height="20" rx="2"/>
  <rect x="316" y="330" width="12" height="20" rx="2"/><rect x="356" y="330" width="12" height="20" rx="2"/>
  <rect x="432" y="330" width="12" height="20" rx="2"/><rect x="472" y="330" width="12" height="20" rx="2"/>
</g>
<g fill="#2e7bff">
  <circle cx="70" cy="140" r="5"/><circle cx="70" cy="250" r="5"/><circle cx="70" cy="360" r="5"/>
  <circle cx="730" cy="232" r="5"/><circle cx="730" cy="250" r="5"/><circle cx="730" cy="296" r="5"/>
</g>
</svg>
