<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
  <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2e7bff"/><stop offset="100%" stop-color="#46d3ff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1b3c" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#16305c" stop-opacity="0.72"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .fl { animation: fl 7s linear infinite; }
  @keyframes fl { to { stroke-dashoffset: -180; } }
  .pz { animation: pz 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes pz { 0%,100% { opacity:.28 } 50% { opacity:.95 } }
  .dr { animation: dr 9s linear infinite; }
  @keyframes dr { to { transform: translateX(120px); } }
  .sp { animation: sp 16s linear infinite; transform-origin: 50% 50%; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fl, .pz, .dr, .sp { animation: none; }
  }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<path d="M0 372 H800" stroke="#0a1b3c" stroke-opacity="0.28" stroke-width="2"/>
<g class="sp" style="transform-origin:286px 214px">
  <g stroke="#0a1b3c" stroke-width="13" stroke-linecap="round" opacity="0.9">
    <path d="M286 214 L286 106"/>
    <path d="M286 214 L380 268"/>
    <path d="M286 214 L192 268"/>
  </g>
</g>
<circle cx="286" cy="214" r="14" fill="#2e7bff"/>
<path d="M280 214 L280 372 h12 L292 214 Z" fill="#0a1b3c" opacity="0.9"/>
<g class="sp" style="transform-origin:566px 214px;animation-duration:22s">
  <g stroke="#0a1b3c" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round">
    <path d="M566 214 L566 138"/>
    <path d="M566 214 L632 252"/>
    <path d="M566 214 L500 252"/>
  </g>
</g>
<circle cx="566" cy="214" r="9" fill="#2e7bff" opacity="0.6"/>
<path d="M562 214 L562 372 h8 L570 214 Z" fill="#0a1b3c" opacity="0.5"/>
<g class="pz">
  <path d="M104 300 a88 88 0 0 1 176 0" fill="none" stroke="url(#lane)" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="3 12"/>
</g>
<g fill="url(#lane)" opacity="0.85">
  <rect x="640" y="330" width="112" height="10" rx="5"/>
  <rect x="640" y="350" width="80" height="10" rx="5"/>
</g>
</svg>
