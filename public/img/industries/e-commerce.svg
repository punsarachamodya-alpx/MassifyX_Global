<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
  <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2e7bff"/><stop offset="100%" stop-color="#46d3ff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1b3c" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#16305c" stop-opacity="0.72"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .fl { animation: fl 7s linear infinite; }
  @keyframes fl { to { stroke-dashoffset: -180; } }
  .pz { animation: pz 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes pz { 0%,100% { opacity:.28 } 50% { opacity:.95 } }
  .dr { animation: dr 9s linear infinite; }
  @keyframes dr { to { transform: translateX(120px); } }
  .sp { animation: sp 16s linear infinite; transform-origin: 50% 50%; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fl, .pz, .dr, .sp { animation: none; }
  }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<g fill="none" stroke="#0a1b3c" stroke-opacity="0.26" stroke-width="2">
  <path d="M60 380 C 200 380, 240 150, 400 150 C 560 150, 600 380, 740 380"/>
</g>
<g fill="none" stroke="url(#lane)" stroke-width="3.5" stroke-linecap="round">
  <path class="fl" stroke-dasharray="12 16"
        d="M60 340 C 200 340, 240 190, 400 190 C 560 190, 600 340, 740 340"/>
</g>
<g fill="#0a1b3c" opacity="0.9">
  <rect x="94" y="316" width="46" height="46" rx="3"/>
  <rect x="222" y="240" width="46" height="46" rx="3"/>
  <rect x="532" y="240" width="46" height="46" rx="3"/>
  <rect x="660" y="316" width="46" height="46" rx="3"/>
</g>
<g stroke="#f1f6ff" stroke-width="2.5" opacity="0.85">
  <path d="M117 316 v46 M94 339 h46"/>
  <path d="M245 240 v46 M222 263 h46"/>
  <path d="M555 240 v46 M532 263 h46"/>
  <path d="M683 316 v46 M660 339 h46"/>
</g>
<g class="pz"><circle cx="400" cy="190" r="52" fill="none" stroke="#46d3ff" stroke-width="2"/></g>
<circle cx="400" cy="190" r="36" fill="#fff" stroke="#2e7bff" stroke-width="3"/>
<path d="M388 178 L412 202 M412 178 L388 202" stroke="#0a1b3c" stroke-width="3.5" stroke-linecap="round"/>
</svg>
