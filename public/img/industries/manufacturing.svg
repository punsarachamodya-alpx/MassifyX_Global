<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
  <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2e7bff"/><stop offset="100%" stop-color="#46d3ff"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1b3c" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#16305c" stop-opacity="0.72"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#0a1b3c" stroke-opacity="0.09" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .fl { animation: fl 7s linear infinite; }
  @keyframes fl { to { stroke-dashoffset: -180; } }
  .pz { animation: pz 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes pz { 0%,100% { opacity:.28 } 50% { opacity:.95 } }
  .dr { animation: dr 9s linear infinite; }
  @keyframes dr { to { transform: translateX(120px); } }
  .sp { animation: sp 16s linear infinite; transform-origin: 50% 50%; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fl, .pz, .dr, .sp { animation: none; }
  }
</style>
<rect width="800" height="500" fill="#f1f6ff"/>
<rect width="800" height="500" fill="url(#grid)"/>

<g fill="#0a1b3c" opacity="0.9">
  <path d="M80 330 L80 250 L140 292 L140 250 L200 292 L200 250 L260 292 L260 250 L320 292 L320 330 Z"/>
</g>
<g fill="none" stroke="#0a1b3c" stroke-width="2" opacity="0.35">
  <path d="M80 330 L720 330"/>
</g>
<rect x="352" y="196" width="26" height="134" fill="#0a1b3c" opacity="0.85"/>
<g class="pz"><circle cx="365" cy="176" r="9" fill="#2e7bff"/></g>
<g fill="url(#lane)" opacity="0.92">
  <rect x="420" y="286" width="58" height="44" rx="2"/>
  <rect x="492" y="262" width="58" height="68" rx="2"/>
  <rect x="564" y="230" width="58" height="100" rx="2"/>
  <rect x="636" y="198" width="58" height="132" rx="2"/>
</g>
<g stroke="#2e7bff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
  <path class="fl" stroke-dasharray="10 12" d="M80 372 L720 372"/>
</g>
<g fill="#0a1b3c" opacity="0.28">
  <circle cx="140" cy="372" r="6"/><circle cx="300" cy="372" r="6"/>
  <circle cx="460" cy="372" r="6"/><circle cx="620" cy="372" r="6"/>
</g>
</svg>
