# nginx reverse proxy — terminates HTTPS and forwards to the Node app on :3000.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/massifyx
#   sudo ln -s /etc/nginx/sites-available/massifyx /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate (this rewrites the file to add the TLS block):
#   sudo certbot --nginx -d massifyx.com -d www.massifyx.com

server {
    listen 80;
    listen [::]:80;
    server_name massifyx.com www.massifyx.com;

    # Uploads are capped at 4 MB in the app; keep nginx from rejecting first.
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The app sets `trust proxy`, so these headers drive req.ip (used for the
        # admin lockout) and secure-cookie behaviour. Without them every visitor
        # looks like 127.0.0.1 and one failed login would lock out everyone.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
