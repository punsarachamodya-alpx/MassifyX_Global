# nginx reverse proxy — terminates HTTPS and forwards to the Node app on :3000.
#
# www.massifyx.com is the canonical hostname. Every other origin (http, and the
# apex massifyx.com on either scheme) 301s to it in a SINGLE hop — each redirect
# block jumps straight to the final https://www.massifyx.com URL rather than
# chaining http->https->www, and $request_uri carries the full path and query.
#
# Deployment order matters, because the TLS blocks below reference certificate
# files that do not exist until certbot has run:
#
#   1. Get the certificate first, using the standalone/webroot challenge:
#        sudo certbot certonly --nginx -d massifyx.com -d www.massifyx.com
#      (or run the old single-server config, then certbot --nginx, then swap
#      this file in — either way, the certs must exist before step 2.)
#
#   2. Install this file and reload:
#        sudo cp deploy/nginx.conf /etc/nginx/sites-available/massifyx
#        sudo ln -s /etc/nginx/sites-available/massifyx /etc/nginx/sites-enabled/
#        sudo rm -f /etc/nginx/sites-enabled/default
#        sudo nginx -t && sudo systemctl reload nginx
#
#   3. Confirm single-hop redirects (each should show exactly one 301):
#        curl -sIL http://massifyx.com/contact     | grep -i '^HTTP\|^location'
#        curl -sIL http://www.massifyx.com/contact | grep -i '^HTTP\|^location'
#        curl -sIL https://massifyx.com/contact    | grep -i '^HTTP\|^location'
#
# IMPORTANT: nothing else may answer for massifyx.com. Remove any other server
# block or vhost claiming these names (`sudo nginx -T | grep -n server_name`),
# or the stale one keeps serving and these redirects never fire.

# ---------------------------------------------------------------- HTTP -> HTTPS
# Both hostnames on port 80, straight to the canonical https origin.
server {
    listen 80;
    listen [::]:80;
    server_name massifyx.com www.massifyx.com;

    # Let ACME renewals through un-redirected; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.massifyx.com$request_uri;
    }
}

# ------------------------------------------------------- apex HTTPS -> www HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name massifyx.com;

    ssl_certificate     /etc/letsencrypt/live/massifyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massifyx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.massifyx.com$request_uri;
}

# ------------------------------------------------------------- canonical origin
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.massifyx.com;

    ssl_certificate     /etc/letsencrypt/live/massifyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massifyx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app accepts up to 4 files x 4 MB per /admin/upload request
    # (routes/admin.js's multer limits) -- must be at least that large or
    # nginx rejects legitimate multi-file uploads before the app ever sees
    # them. A little headroom above the theoretical max for multipart
    # framing overhead.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The app sets `trust proxy`, so these headers drive req.ip (used for the
        # admin lockout) and secure-cookie behaviour. Without them every visitor
        # looks like 127.0.0.1 and one failed login would lock out everyone.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
